      // Date Formatting Utility
      function formatEventDate(isoString) {
        if (!isoString) return 'Date N/A';
        const date = new Date(isoString);
        if (isNaN(date.getTime())) return isoString;

        const formattedStr = date.toLocaleString('en-US', {
          month: 'short',
          day: 'numeric',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });

        const diffMs = Date.now() - date.getTime();
        const diffMins = Math.floor(diffMs / (1000 * 60));
        const diffHours = Math.floor(diffMins / 60);
        const diffDays = Math.floor(diffHours / 24);

        let relative = 'Just now';
        if (diffDays > 0) relative = `${diffDays}d ago`;
        else if (diffHours > 0) relative = `${diffHours}h ago`;
        else if (diffMins > 0) relative = `${diffMins}m ago`;

        return `${formattedStr} (${relative})`;
      }

      async function fetchDisasters() {
        const apiEvents = [];
        try {
          const [usgsRes, eonetRes] = await Promise.allSettled([
            fetch('https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&minmagnitude=2.0&orderby=time&limit=60').then(r => r.json()),
            fetch('https://eonet.gsfc.nasa.gov/api/v3/events?status=open&limit=80').then(r => r.json())
          ]);

          if (usgsRes.status === 'fulfilled' && usgsRes.value?.features) {
            usgsRes.value.features.forEach((item) => {
              const props = item.properties || {};
              const coords = item.geometry?.coordinates || [0,0,0];
              const mag = props.mag || 2.5;
              const tsunami = props.tsunami === 1;
              let category = tsunami ? 'tsunami' : 'earthquake';
              let severity = 'minor';
              if (mag >= 7.0 || tsunami) severity = 'critical';
              else if (mag >= 5.5) severity = 'high';
              else if (mag >= 3.5) severity = 'moderate';

              apiEvents.push({
                id: `usgs-${item.id}`,
                title: props.title || `M ${mag} Earthquake`,
                category,
                severity,
                latitude: coords[1],
                longitude: coords[0],
                locationName: props.place || 'Unknown Epicenter',
                timestamp: new Date(props.time || Date.now()).toISOString(),
                magnitude: mag,
                depthKm: Math.round(coords[2] || 10),
                tsunamiAlert: tsunami,
                source: tsunami ? 'USGS_NOAA' : 'USGS',
                url: props.url,
                affectedRadiusKm: Math.round(Math.pow(10, 0.43 * mag)),
                safetyAdvice: [
                  'DROP, COVER, and HOLD ON under sturdy furniture.',
                  'Stay away from glass, windows, and exterior walls.',
                  tsunami ? 'TSUNAMI WARNING: Move inland and to higher ground immediately!' : 'Be prepared for potential aftershocks.'
                ]
              });
            });
          }

          if (eonetRes.status === 'fulfilled' && eonetRes.value?.events) {
            eonetRes.value.events.forEach((item) => {
              const catTitle = (item.categories?.[0]?.title || '').toLowerCase();
              let category = 'wildfire';
              if (catTitle.includes('flood')) category = 'flood';
              else if (catTitle.includes('drought')) category = 'drought';
              else if (catTitle.includes('landslide') || catTitle.includes('mudslide')) category = 'landslide';
              else if (catTitle.includes('wildfire') || catTitle.includes('fire')) category = 'wildfire';
              else if (catTitle.includes('storm') || catTitle.includes('cyclone') || catTitle.includes('hurricane')) category = 'storm';
              else if (catTitle.includes('volcano')) category = 'volcano';

              const geom = item.geometry?.[item.geometry.length - 1];
              const coords = geom?.coordinates || [0, 0];
              const lat = Array.isArray(coords) && typeof coords[1] === 'number' ? coords[1] : 0;
              const lng = Array.isArray(coords) && typeof coords[0] === 'number' ? coords[0] : 0;

              let severity = 'moderate';
              if (category === 'flood' || category === 'drought') severity = 'critical';
              if (category === 'wildfire') severity = 'high';
              if (category === 'storm' || category === 'landslide' || category === 'volcano') severity = 'critical';

              apiEvents.push({
                id: `eonet-${item.id}`,
                title: item.title || `${category.toUpperCase()} Telemetry Alert`,
                category,
                severity,
                latitude: lat,
                longitude: lng,
                locationName: item.title || 'Global Incident Region',
                timestamp: geom?.date || new Date().toISOString(),
                source: 'NASA_EONET',
                description: item.description || `Active ${category} tracked by NASA Earth Observatory satellite sensors.`,
                url: item.sources?.[0]?.url,
                affectedRadiusKm: category === 'storm' ? 350 : (category === 'drought' ? 500 : (category === 'flood' ? 200 : 80)),
                safetyAdvice: [
                  'Monitor official local emergency broadcasts.',
                  'Ensure evacuation routes and emergency supplies are ready.',
                  'Follow instructions from local emergency authorities.'
                ]
              });
            });
          }
        } catch (err) {
          console.warn('API fetch warning, using hazard presets:', err);
        }

        // Combine API events and all hazard presets without excluding regional presets
        const combined = [...HAZARD_PRESETS];
        apiEvents.forEach((ev) => {
          if (!combined.some(c => c.id === ev.id)) {
            combined.push(ev);
          }
        });

        return combined;
      }

        const [activeTab, setActiveTab] = useState('map');
        const [selectedEvent, setSelectedEvent] = useState(null);
        
        // Map Theme State: Default to 'color' (CartoDB Voyager CDN)
        const [activeMapTheme, setActiveMapTheme] = useState('color');

        const [windowWidth, setWindowWidth] = useState(window.innerWidth);
        const [showPhoneSimulator, setShowPhoneSimulator] = useState(false);

        useEffect(() => {
          const handleResize = () => setWindowWidth(window.innerWidth);
          window.addEventListener('resize', handleResize);
          return () => window.removeEventListener('resize', handleResize);
        }, []);

        const isDesktop = windowWidth >= 768;

        const mapRef = useRef(null);
        const tileLayerRef = useRef(null);
        const labelsLayerRef = useRef(null);
        const mapContainerRef = useRef(null);
        const markersRef = useRef([]);
        const circlesRef = useRef([]);

        const loadData = async () => {
          setRefreshing(true);
          const data = await fetchDisasters();
          setEvents(data);
          setLoading(false);
          setRefreshing(false);
        };

        useEffect(() => {
          loadData();
          const timer = setInterval(loadData, 60000);
          return () => clearInterval(timer);
        }, []);

        const filteredEvents = useMemo(() => {
          return events.filter((ev) => {
            const matchesSearch = ev.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
              ev.locationName.toLowerCase().includes(searchQuery.toLowerCase()) ||
              ev.category.toLowerCase().includes(searchQuery.toLowerCase());
            const matchesCat = selectedCategory === 'all' || ev.category === selectedCategory;
            return matchesSearch && matchesCat;
          });
        }, [events, searchQuery, selectedCategory]);

        const criticalCount = useMemo(() => {
          return events.filter(e => e.severity === 'critical').length;
        }, [events]);

        // Initialize Leaflet Map
        useEffect(() => {
          if (mapContainerRef.current && !mapRef.current) {
            const map = L.map(mapContainerRef.current, {
              zoomControl: false,
              attributionControl: false
            }).setView([26.2, 92.9], 5);

            const themeConfig = MAP_THEMES[activeMapTheme];
            const tileLayer = L.tileLayer(themeConfig.url, {
              maxZoom: 19,
              subdomains: 'abcd'
            });

            if (themeConfig.fallback) {
              tileLayer.on('tileerror', () => {
                L.tileLayer(themeConfig.fallback, { maxZoom: 19 }).addTo(map);
              });
            }

            tileLayer.addTo(map);
            tileLayerRef.current = tileLayer;

            if (themeConfig.labelsUrl) {
              const labelsLayer = L.tileLayer(themeConfig.labelsUrl, { maxZoom: 19 }).addTo(map);
              labelsLayerRef.current = labelsLayer;
            }

            mapRef.current = map;
          }

          const resizeTimer = setTimeout(() => {
            if (mapRef.current) {
              mapRef.current.invalidateSize();
            }
          }, 250);

          return () => clearTimeout(resizeTimer);
        }, [activeTab, isDesktop, showPhoneSimulator]);

        // Switch Map Tile Theme Dynamically
        useEffect(() => {
          if (mapRef.current) {
            if (tileLayerRef.current) {
              mapRef.current.removeLayer(tileLayerRef.current);
            }
            if (labelsLayerRef.current) {
              mapRef.current.removeLayer(labelsLayerRef.current);
              labelsLayerRef.current = null;
            }

            const themeConfig = MAP_THEMES[activeMapTheme];
            const newLayer = L.tileLayer(themeConfig.url, {
              maxZoom: 19,
              subdomains: 'abcd'
            });

            if (themeConfig.fallback) {
              newLayer.on('tileerror', () => {
                L.tileLayer(themeConfig.fallback, { maxZoom: 19 }).addTo(mapRef.current);
              });
            }

            newLayer.addTo(mapRef.current);
            tileLayerRef.current = newLayer;

            if (themeConfig.labelsUrl) {
              const labelsLayer = L.tileLayer(themeConfig.labelsUrl, { maxZoom: 19 }).addTo(mapRef.current);
              labelsLayerRef.current = labelsLayer;
            }
          }
        }, [activeMapTheme]);

        useEffect(() => {
          if (!mapRef.current) return;
          const map = mapRef.current;

          markersRef.current.forEach(m => m.remove());
          circlesRef.current.forEach(c => c.remove());
          markersRef.current = [];
          circlesRef.current = [];

          filteredEvents.forEach(ev => {
            let color = '#3b82f6';

                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="🔍 Search for floods, droughts, quakes, etc..."
                    className="w-full pl-3 pr-3 py-1.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-rose-500/50"
                  />
                </div>
              </div>

              <div className="flex-1 flex overflow-hidden relative">
                <aside className="w-[420px] bg-[#0b0f19] border-r border-slate-800 flex flex-col h-full shrink-0">
                  <div className="flex border-b border-slate-800 bg-[#0f172a]/80">
                    {[
                      { id: 'feed', label: 'Incidents Feed', icon: '📋' },
                      { id: 'analytics', label: 'Analytics', icon: '📊' },
                      { id: 'alerts', label: 'Safety Protocols', icon: '🚨' },
                    ].map((t) => (
                      <button
                        key={t.id}
                        onClick={() => setActiveTab(t.id)}
                        className={`flex-1 py-2.5 text-xs font-bold flex items-center justify-center space-x-1.5 border-b-2 transition-all ${
                          activeTab === t.id ? 'border-rose-500 text-rose-400 bg-slate-900/60' : 'border-transparent text-slate-400 hover:text-slate-200'
                        }`}
                      >
                        <span>{t.icon}</span>
                        <span>{t.label}</span>
                      </button>
                    ))}
                  </div>

                  <div className="flex-1 overflow-y-auto p-4 space-y-3">
                    {activeTab === 'feed' && (
                      <>
                        <div className="flex items-center justify-between mb-1">
                          <h2 className="text-xs font-bold text-slate-300 uppercase tracking-wider">
                            ACTIVE GLOBAL INCIDENTS ({filteredEvents.length})
                          </h2>
                          <span className="text-[10px] text-slate-500 font-mono">Live Feeds</span>
                        </div>

                        {filteredEvents.map((ev) => (
                          <div
                            key={ev.id}
                            onClick={() => setSelectedEvent(ev)}
                            className={`bg-[#151c2e] hover:bg-[#1c263e] border rounded-2xl p-4 cursor-pointer transition-all border-slate-800 hover:border-slate-700 active:scale-[0.99] ${
                              selectedEvent?.id === ev.id ? 'ring-2 ring-rose-500/50 bg-[#1c263e]' : ''
                            } ${ev.severity === 'critical' ? 'border-rose-500/40 shadow-md' : ''}`}
                          >
                            <div className="flex items-center justify-between mb-2">
                              <div className="flex items-center space-x-2">
                                <span className={`px-2 py-0.5 rounded text-[10px] font-extrabold uppercase ${
                                  ev.severity === 'critical' ? 'bg-rose-500 text-white' :
                                  ev.severity === 'high' ? 'bg-amber-500 text-slate-950' :
                                  'bg-slate-700 text-slate-200'
                                }`}>
                                  {ev.severity}
                                </span>
                                <span className="px-2 py-0.5 rounded text-[10px] font-bold uppercase bg-slate-800 text-slate-300">
                                  {ev.category}
                                </span>
                              </div>
                              <span className="text-[10px] text-slate-400 font-mono">{ev.source}</span>
                            </div>

                            <h3 className="text-sm font-bold text-slate-100 mb-1 leading-snug">{ev.title}</h3>
                            <p className="text-xs text-slate-300 mb-1">📍 {ev.locationName}</p>
                            <p className="text-[11px] font-semibold text-rose-400 mb-2.5 flex items-center space-x-1">
                              <span>📅 Started:</span>
                              <span>{formatEventDate(ev.timestamp)}</span>
                            </p>

                            {ev.description && (
                              <p className="text-xs text-slate-400 mb-2.5 bg-slate-900/60 p-2.5 rounded-xl border border-slate-800/80">
                                {ev.description}
                              </p>
                            )}

                            <div className="flex flex-wrap gap-2 text-xs font-medium text-slate-300 pt-2 border-t border-slate-800">
                              {ev.magnitude && <span className="px-2.5 py-0.5 rounded-lg bg-slate-800 border border-slate-700">Magnitude {ev.magnitude}</span>}
                              {ev.depthKm && <span className="px-2.5 py-0.5 rounded-lg bg-slate-800 border border-slate-700">Depth {ev.depthKm} km</span>}
                              {ev.tsunamiAlert && <span className="px-2.5 py-0.5 rounded-lg bg-rose-500/20 text-rose-300 font-bold border border-rose-500/40 animate-pulse">🌊 TSUNAMI ALERT</span>}
                              {ev.affectedRadiusKm && <span className="px-2.5 py-0.5 rounded-lg bg-slate-800 border border-slate-700">Zone {ev.affectedRadiusKm} km</span>}
                            </div>
                          </div>
                        ))}
                      </>
                    )}

                    {activeTab === 'analytics' && (
                      <div className="space-y-4">
                        <h2 className="text-sm font-bold text-slate-100 font-heading">Multi-Hazard Crisis Telemetry</h2>

                        <div className="grid grid-cols-2 gap-3">
                          <div className="bg-[#151c2e] border border-slate-800 rounded-2xl p-4">
                            <span className="text-xs uppercase font-bold text-slate-400">Total Tracked</span>
                            <p className="text-2xl font-extrabold text-slate-100 font-heading mt-1">{events.length}</p>
                          </div>
                          <div className="bg-[#151c2e] border border-rose-500/30 rounded-2xl p-4">
                            <span className="text-xs uppercase font-bold text-rose-400">Critical Threats</span>
                            <p className="text-2xl font-extrabold text-rose-400 font-heading mt-1">{criticalCount}</p>
                          </div>
                        </div>

                        <div className="bg-[#151c2e] border border-slate-800 rounded-2xl p-4 space-y-3">
                          <h3 className="text-xs font-bold text-slate-300 uppercase">Natural Disaster Breakdown</h3>
                          {[
                            { id: 'flood', label: 'Floods', color: 'bg-blue-500' },
                            { id: 'drought', label: 'Droughts', color: 'bg-amber-500' },
                            { id: 'landslide', label: 'Landslides', color: 'bg-emerald-500' },
                            { id: 'earthquake', label: 'Earthquakes', color: 'bg-rose-500' },
                            { id: 'tsunami', label: 'Tsunamis', color: 'bg-cyan-500' },
                            { id: 'wildfire', label: 'Wildfires', color: 'bg-orange-500' },
                            { id: 'storm', label: 'Storms', color: 'bg-purple-500' },
                            { id: 'volcano', label: 'Volcanoes', color: 'bg-red-600' }
                          ].map((cat) => {
                            const count = events.filter(e => e.category === cat.id).length;
                            const pct = events.length ? Math.round((count / events.length) * 100) : 0;
                            return (
                              <div key={cat.id} className="space-y-1.5">
                                <div className="flex justify-between text-xs text-slate-300 capitalize">
                                  <span>{cat.label}</span>
                                  <span className="font-bold">{count} ({pct}%)</span>
                                </div>
                                <div className="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                                  <div className={`h-full ${cat.color} rounded-full`} style={{ width: `${pct}%` }} />
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    )}

                    {activeTab === 'alerts' && (
                      <div className="space-y-3">
                        <div className="bg-rose-500/10 border border-rose-500/30 p-4 rounded-2xl">
                          <h3 className="text-xs font-bold text-rose-300">Natural Hazard Safety Protocols</h3>
                          <p className="text-xs text-rose-200/80 mt-1">Official emergency response procedures for Assam floods, droughts & landslides.</p>
                        </div>

                        {[
                          { title: '🌧️ Assam Flood Safety Protocol', advice: 'Evacuate riverbank embankments (char areas) to high-ground relief camps. Call ASDMA helpline 1070 / 1077 for NDRF rescue boats.' },
                          { title: '🏜️ Drought Water Protocol', advice: 'Adhere to strict municipal water rationing, boil emergency tap water, and prevent agricultural wildland fires.' },
                          { title: '🪨 Landslide Protocol', advice: 'Listen for cracking trees or sudden mudflow; move out of drainage paths to high ground.' },
                          { title: '🌊 Tsunami Protocol', advice: 'Evacuate inland to 30m+ elevation immediately if coastal earthquake or sudden sea recession occurs.' }
                        ].map((item, idx) => (
                          <div key={idx} className="bg-[#151c2e] border border-slate-800 rounded-2xl p-4">
                            <h4 className="text-xs font-bold text-slate-200">{item.title}</h4>
                            <p className="text-xs text-slate-400 mt-1.5 leading-relaxed">{item.advice}</p>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </aside>

                <main className="flex-1 h-full relative">
                  {mapThemeControl}
                  <div ref={mapContainerRef} className="w-full h-full absolute inset-0 z-0" />
                </main>
              </div>
            </div>
          );
        }

        // Mobile Device View or Desktop Simulator View
        return (
          <div className="min-h-screen w-full flex flex-col items-center justify-center bg-[#050811] p-0 sm:p-6 relative">
            {showPhoneSimulator ? (
              <div className="flex flex-col items-center">
                <div className="mb-3 flex items-center space-x-3 bg-slate-900 border border-slate-800 px-4 py-2 rounded-2xl shadow-lg">
                  <span className="text-xs font-bold text-slate-200">📱 Mobile Phone Simulator Active</span>
                  <button
                    onClick={() => setShowPhoneSimulator(false)}
                    className="px-3 py-1 bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 text-xs font-bold rounded-lg border border-rose-500/40 transition-all"
                  >
                    Back to Desktop Dashboard
                  </button>
                </div>

                <div className="w-full max-w-[410px] h-[840px] bg-[#0b0f19] rounded-[48px] border-[10px] border-slate-800/90 shadow-[0_0_60px_rgba(0,0,0,0.9)] overflow-hidden relative border-t-[12px] flex flex-col">
                  {/* Dynamic Island Notch */}
                  <div className="absolute top-2 left-1/2 -translate-x-1/2 w-28 h-4 bg-black rounded-full z-50 flex items-center justify-end px-2 pointer-events-none">
                    <div className="w-2 h-2 rounded-full bg-slate-800 border border-slate-700" />
                  </div>
                  {/* Simulated Status Bar ONLY in Simulator Mode */}
                  <div className="bg-[#0b0f19] text-slate-400 text-[10px] px-6 pt-3 pb-1 flex justify-between items-center select-none border-b border-slate-900/50 z-40">
                    <span className="font-semibold text-slate-200">9:41</span>
                    <div className="flex items-center space-x-1.5 text-[9px]">
                      <span>5G</span>
                      <span>📶</span>
                      <span>🔋 98%</span>
                    </div>
                  </div>
                  {mobileAppUI}
                  {/* Home Indicator */}
                  <div className="bg-[#0b0f19] pt-1 pb-1.5 flex justify-center z-40">
                    <div className="w-28 h-1 bg-slate-700 rounded-full" />
                  </div>
                </div>
              </div>
            ) : (
              <div className="w-full h-screen">
                {mobileAppUI}
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
